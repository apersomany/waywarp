name: CI

on:
  push:
    branches: [master]
    paths:
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "install.sh"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "benches/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "rust-toolchain*"
      - "flake.nix"
      - "flake.lock"
      - "nix/**"
      - "install.sh"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (x86_64-linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - name: Run checks
        run: |
          for check in package format installer; do
            nix build --print-build-logs ".#checks.x86_64-linux.$check"
          done
      - name: Run VM integration tests
        if: github.event_name == 'workflow_dispatch'
        run: nix build --print-build-logs .#checks.x86_64-linux.vm
