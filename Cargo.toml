[package]
name = "waywarp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Run Cloudflare WARP clients side by side, and exit in the region you choose"
license = "MIT"
readme = "README.md"
repository = "https://github.com/apersomany/waywarp"
homepage = "https://github.com/apersomany/waywarp"
keywords = ["cloudflare", "warp", "vpn", "proxy", "region"]
categories = ["command-line-utilities", "network-programming"]
include = ["/src", "/docs", "/README.md", "/LICENSE", "/CHANGELOG.md"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
ipnet = { version = "2.12.2", features = ["serde"] }
mio = { version = "1.2.3", default-features = false, features = ["os-poll", "net", "os-ext"] }
nix = { version = "0.31.3", features = ["fs", "inotify", "mount", "net", "process", "sched", "signal", "socket", "uio", "user"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
slab = "0.4.12"
socket2 = { version = "0.6.5", features = ["all"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std", "ansi"] }
ureq = { version = "3.4.2", features = ["socks-proxy"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
